name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel a superseded run on a PR branch; let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The real-model tests need the models (AgDR-0006). The cache is keyed by the
      # lock, and fetch-models re-checks every cached file's hash either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/playground/public/models
          key: models-${{ hashFiles('models.lock.json') }}
      - run: npm run fetch-models
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # Offline and no-third-party tests against the built page (AgDR-0008). The browser is
      # cached by Playwright's installed version; --with-deps adds the OS libraries Chromium needs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
